<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Buintel Automations</title>

  <!-- Halo sutil -->
  <circle cx="50" cy="50" r="48" fill="#00C8F0" fill-opacity="0.04"/>

  <g transform="translate(50,50)">
    <!-- Círculo exterior punteado (señal/datos) -->
    <circle r="44" fill="none" stroke="#00C8F0" stroke-width="1"
            stroke-opacity="0.15"/>
    <circle r="44" fill="none" stroke="#00C8F0" stroke-width="1.5"
            stroke-dasharray="10 4.5 3.5 4.5 18 4.5 3.5 4.5 10 4.5 29 4.5"
            stroke-linecap="round" stroke-opacity="0.85"/>
    <!-- Anillo interior sólido -->
    <circle r="35" fill="none" stroke="#00C8F0" stroke-width="2"/>
    <circle r="33" fill="#030712"/>

    <!-- Líneas de datos horizontales (3 niveles) -->
    <line x1="-19" y1="-10.5" x2="-8"  y2="-10.5" stroke="#00C8F0" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.9"/>
    <line x1="-5"  y1="-10.5" x2="6"   y2="-10.5" stroke="#00C8F0" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>
    <line x1="9"   y1="-10.5" x2="19"  y2="-10.5" stroke="#00C8F0" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.35"/>

    <line x1="-19" y1="0"     x2="-2"  y2="0"     stroke="#00C8F0" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5"/>
    <line x1="1"   y1="0"     x2="19"  y2="0"     stroke="#00C8F0" stroke-width="2"   stroke-linecap="round" stroke-opacity="1"/>

    <line x1="-19" y1="10.5"  x2="0"   y2="10.5"  stroke="#00C8F0" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.35"/>
    <line x1="4"   y1="10.5"  x2="11"  y2="10.5"  stroke="#00C8F0" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7"/>
    <line x1="14"  y1="10.5"  x2="19"  y2="10.5"  stroke="#00C8F0" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.4"/>

    <!-- Nodos cardinales -->
    <circle cx="35"  cy="0"  r="3" fill="#030712" stroke="#00C8F0" stroke-width="1.5"/>
    <circle cx="-35" cy="0"  r="3" fill="#030712" stroke="#00C8F0" stroke-width="1.5"/>
    <circle cx="0"  cy="-35" r="3" fill="#00C8F0"/>
    <circle cx="0"  cy="35"  r="2" fill="#00C8F0" fill-opacity="0.4"/>

    <!-- Conector superior -->
    <line x1="0" y1="-35" x2="0" y2="-44" stroke="#00C8F0" stroke-width="1.2" stroke-opacity="0.6" stroke-linecap="round"/>
    <line x1="-5" y1="-40" x2="5" y2="-40" stroke="#00C8F0" stroke-width="1.2" stroke-opacity="0.4" stroke-linecap="round"/>

    <!-- Centro -->
    <circle r="3.5" fill="#00C8F0"/>
    <circle r="1.7" fill="#030712"/>
  </g>
</svg>
