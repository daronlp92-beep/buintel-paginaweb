<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Buintel Automations</title>
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C8F0"/>
      <stop offset="100%" stop-color="#0084C8"/>
    </linearGradient>
  </defs>

  <!-- Halo sutil -->
  <circle cx="50" cy="50" r="46" fill="#00C8F0" fill-opacity="0.05"/>

  <g transform="translate(50,50)">
    <!-- 8 dientes -->
    <g fill="#00C8F0">
      <rect x="-4.9" y="-50" width="9.7" height="12.5" rx="1.4"/>
      <rect x="-4.9" y="-50" width="9.7" height="12.5" rx="1.4" transform="rotate(45)"/>
      <rect x="-4.9" y="-50" width="9.7" height="12.5" rx="1.4" transform="rotate(90)"/>
      <rect x="-4.9" y="-50" width="9.7" height="12.5" rx="1.4" transform="rotate(135)"/>
      <rect x="-4.9" y="-50" width="9.7" height="12.5" rx="1.4" transform="rotate(180)"/>
      <rect x="-4.9" y="-50" width="9.7" height="12.5" rx="1.4" transform="rotate(225)"/>
      <rect x="-4.9" y="-50" width="9.7" height="12.5" rx="1.4" transform="rotate(270)"/>
      <rect x="-4.9" y="-50" width="9.7" height="12.5" rx="1.4" transform="rotate(315)"/>
    </g>
    <!-- Aro exterior -->
    <circle r="43" fill="none" stroke="#00C8F0" stroke-width="7"/>
    <!-- Relleno interior -->
    <circle r="34" fill="#030712"/>
    <!-- Cruz -->
    <line x1="-21" y1="0" x2="21" y2="0" stroke="#00C8F0" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7"/>
    <line x1="0" y1="-21" x2="0" y2="21" stroke="#00C8F0" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7"/>
    <!-- Nodos -->
    <circle cx="21"  cy="0"  r="3" fill="#00C8F0"/>
    <circle cx="-21" cy="0"  r="3" fill="#00C8F0"/>
    <circle cx="0"  cy="21"  r="3" fill="#00C8F0"/>
    <circle cx="0"  cy="-21" r="3" fill="#00C8F0"/>
    <!-- Centro -->
    <circle r="6"   fill="#00C8F0"/>
    <circle r="3"   fill="#030712"/>
  </g>
</svg>
