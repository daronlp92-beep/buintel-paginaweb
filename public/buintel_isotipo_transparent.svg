<svg width="200" height="200" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Buintel Automations — Isotipo Fondo Transparente</title>
  <desc>Isotipo de ave-circuito de Buintel Automations sobre fondo transparente</desc>
  <defs>
    <linearGradient id="wgTrans" x1="0" y1="0" x2="72" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="45%" stop-color="#00AEEF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- Transparent background: no rect fill -->

  <!-- Hex frame -->
  <polygon points="36,4 64,20 64,52 36,68 8,52 8,20" fill="rgba(0,30,60,0.85)" stroke="url(#wgTrans)" stroke-width="0.8"/>

  <!-- Circuit grid -->
  <line x1="14" y1="36" x2="58" y2="36" stroke="rgba(0,174,239,0.12)" stroke-width="0.5"/>
  <line x1="36" y1="10" x2="36" y2="62" stroke="rgba(0,174,239,0.12)" stroke-width="0.5"/>

  <!-- Body spine -->
  <line x1="36" y1="18" x2="36" y2="50" stroke="#00AEEF" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Head node -->
  <circle cx="36" cy="18" r="4" fill="#081526" stroke="#00F5FF" stroke-width="1.2"/>
  <circle cx="36" cy="18" r="1.5" fill="#00F5FF"/>

  <!-- Left wing -->
  <path d="M33 24 L16 28 L14 22 L30 20" fill="none" stroke="url(#wgTrans)" stroke-width="1.3" stroke-linejoin="round"/>
  <line x1="24" y1="26.5" x2="22" y2="32" stroke="#00AEEF" stroke-width="0.9"/>
  <line x1="19" y1="27.3" x2="17" y2="34" stroke="#00AEEF" stroke-width="0.9"/>
  <line x1="29" y1="25.8" x2="27" y2="30" stroke="#00F5FF" stroke-width="0.9"/>
  <circle cx="22" cy="32" r="1.3" fill="#00AEEF"/>
  <circle cx="17" cy="34" r="1.3" fill="#00AEEF"/>
  <circle cx="27" cy="30" r="1.3" fill="#00F5FF"/>
  <circle cx="14" cy="22" r="1.5" fill="#00F5FF"/>

  <!-- Right wing -->
  <path d="M39 24 L56 28 L58 22 L42 20" fill="none" stroke="url(#wgTrans)" stroke-width="1.3" stroke-linejoin="round"/>
  <line x1="48" y1="26.5" x2="50" y2="32" stroke="#00AEEF" stroke-width="0.9"/>
  <line x1="53" y1="27.3" x2="55" y2="34" stroke="#00AEEF" stroke-width="0.9"/>
  <line x1="43" y1="25.8" x2="45" y2="30" stroke="#00F5FF" stroke-width="0.9"/>
  <circle cx="50" cy="32" r="1.3" fill="#00AEEF"/>
  <circle cx="55" cy="34" r="1.3" fill="#00AEEF"/>
  <circle cx="45" cy="30" r="1.3" fill="#00F5FF"/>
  <circle cx="58" cy="22" r="1.5" fill="#00F5FF"/>

  <!-- Chest nodes -->
  <circle cx="36" cy="26" r="1.5" fill="#00F5FF"/>
  <circle cx="36" cy="34" r="1.8" fill="#00AEEF" stroke="#00F5FF" stroke-width="0.6"/>

  <!-- Tail feathers / violet circuit -->
  <path d="M36 38 L30 44 L28 50" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-linecap="round"/>
  <path d="M36 38 L42 44 L44 50" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-linecap="round"/>
  <circle cx="28" cy="50" r="1.5" fill="#8B5CF6"/>
  <circle cx="44" cy="50" r="1.5" fill="#8B5CF6"/>
  <circle cx="36" cy="52" r="1.8" fill="#A855F7" stroke="#8B5CF6" stroke-width="0.6"/>

  <!-- Data flow node -->
  <circle cx="36" cy="42" r="1" fill="#00F5FF" opacity="0.7"/>

  <!-- Wing-body connectors -->
  <line x1="33" y1="22" x2="36" y2="22" stroke="rgba(0,245,255,0.4)" stroke-width="0.8"/>
  <line x1="39" y1="22" x2="36" y2="22" stroke="rgba(0,245,255,0.4)" stroke-width="0.8"/>
</svg>
