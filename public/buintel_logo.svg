    <circle cx="60"  cy="0"  r="4" fill="#0A1628" stroke="#00C8F0" stroke-width="2"/>
    <circle cx="-60" cy="0"  r="4" fill="#0A1628" stroke="#00C8F0" stroke-width="2"/>
