    <line x1="-8"  y1="-18" x2="10"  y2="-18" stroke="#00C8F0" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6"/>
    <line x1="16"  y1="-18" x2="32"  y2="-18" stroke="#00C8F0" stroke-width="2" stroke-linecap="round" stroke-opacity="0.35"/>
    <line x1="-32" y1="0"   x2="-4"  y2="0"   stroke="#00C8F0" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5"/>
    <line x1="2"   y1="0"   x2="32"  y2="0"   stroke="#00C8F0" stroke-width="2.5" stroke-linecap="round" stroke-opacity="1"/>
    <line x1="-32" y1="18"  x2="0"   y2="18"  stroke="#00C8F0" stroke-width="2" stroke-linecap="round" stroke-opacity="0.35"/>
    <line x1="6"   y1="18"  x2="18"  y2="18"  stroke="#00C8F0" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>
    <line x1="24"  y1="18"  x2="32"  y2="18"  stroke="#00C8F0" stroke-width="2" stroke-linecap="round" stroke-opacity="0.4"/>
    <circle r="5" fill="#00C8F0"/>
