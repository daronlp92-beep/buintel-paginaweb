<svg width="680" height="400" viewBox="0 0 680 400" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Logo Buintel Automations</title>
  <desc>Logo minimalista digital, azul cian sobre fondo oscuro</desc>

  <rect width="680" height="400" fill="#0A1628" rx="14"/>
  <circle cx="200" cy="195" r="95" fill="#00C8F0" fill-opacity="0.04"/>

  <g transform="translate(200,195)">
    <circle r="75" fill="none" stroke="#00C8F0" stroke-width="1.5" stroke-opacity="0.15"/>
