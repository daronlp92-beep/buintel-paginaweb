<svg width="420" height="100" viewBox="0 0 420 100" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Buintel Automations — Logo Horizontal Claro</title>
  <desc>Logo de Buintel Automations con isotipo de ave-circuito y texto corporativo sobre fondo claro</desc>
  <defs>
    <linearGradient id="wingGradL" x1="0" y1="0" x2="72" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0080C8"/>
      <stop offset="50%" stop-color="#0064B4"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="bgGradL" x1="0" y1="0" x2="420" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0F6FF"/>
      <stop offset="100%" stop-color="#E8F4FD"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&amp;family=Exo+2:wght@300&amp;display=swap');
      .brand-main-l { font-family: 'Rajdhani', 'Arial Black', sans-serif; font-size: 38px; font-weight: 700; letter-spacing: 0.12em; }
      .brand-sub-l  { font-family: 'Exo 2', 'Arial', sans-serif; font-size: 11px; font-weight: 300; letter-spacing: 0.42em; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="420" height="100" rx="12" fill="url(#bgGradL)"/>
  <defs>
    <pattern id="gridL" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0,100,200,0.05)" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="420" height="100" rx="12" fill="url(#gridL)"/>
  <rect width="420" height="100" rx="12" fill="none" stroke="rgba(0,100,200,0.15)" stroke-width="0.8"/>

  <!-- ── ISOTIPO ── -->
  <g transform="translate(18, 14)">
    <polygon points="36,4 64,20 64,52 36,68 8,52 8,20" fill="rgba(0,80,180,0.05)" stroke="url(#wingGradL)" stroke-width="0.8"/>
    <line x1="14" y1="36" x2="58" y2="36" stroke="rgba(0,80,180,0.08)" stroke-width="0.5"/>
    <line x1="36" y1="10" x2="36" y2="62" stroke="rgba(0,80,180,0.08)" stroke-width="0.5"/>
    <line x1="36" y1="18" x2="36" y2="50" stroke="#0080C8" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="36" cy="18" r="4" fill="rgba(0,80,180,0.08)" stroke="#0080C8" stroke-width="1.2"/>
    <circle cx="36" cy="18" r="1.5" fill="#0080C8"/>
    <path d="M33 24 L16 28 L14 22 L30 20" fill="none" stroke="url(#wingGradL)" stroke-width="1.3" stroke-linejoin="round"/>
    <line x1="24" y1="26.5" x2="22" y2="32" stroke="#0064B4" stroke-width="0.9"/>
    <line x1="19" y1="27.3" x2="17" y2="34" stroke="#0064B4" stroke-width="0.9"/>
    <line x1="29" y1="25.8" x2="27" y2="30" stroke="#0080C8" stroke-width="0.9"/>
    <circle cx="22" cy="32" r="1.3" fill="#0064B4"/>
    <circle cx="17" cy="34" r="1.3" fill="#0064B4"/>
    <circle cx="27" cy="30" r="1.3" fill="#0080C8"/>
    <circle cx="14" cy="22" r="1.5" fill="#0080C8"/>
    <path d="M39 24 L56 28 L58 22 L42 20" fill="none" stroke="url(#wingGradL)" stroke-width="1.3" stroke-linejoin="round"/>
    <line x1="48" y1="26.5" x2="50" y2="32" stroke="#0064B4" stroke-width="0.9"/>
    <line x1="53" y1="27.3" x2="55" y2="34" stroke="#0064B4" stroke-width="0.9"/>
    <line x1="43" y1="25.8" x2="45" y2="30" stroke="#0080C8" stroke-width="0.9"/>
    <circle cx="50" cy="32" r="1.3" fill="#0064B4"/>
    <circle cx="55" cy="34" r="1.3" fill="#0064B4"/>
    <circle cx="45" cy="30" r="1.3" fill="#0080C8"/>
    <circle cx="58" cy="22" r="1.5" fill="#0080C8"/>
    <circle cx="36" cy="26" r="1.5" fill="#0080C8"/>
    <circle cx="36" cy="34" r="1.8" fill="#0064B4" stroke="#0080C8" stroke-width="0.6"/>
    <path d="M36 38 L30 44 L28 50" fill="none" stroke="#6D28D9" stroke-width="1" stroke-linecap="round"/>
    <path d="M36 38 L42 44 L44 50" fill="none" stroke="#6D28D9" stroke-width="1" stroke-linecap="round"/>
    <circle cx="28" cy="50" r="1.5" fill="#6D28D9"/>
    <circle cx="44" cy="50" r="1.5" fill="#6D28D9"/>
    <circle cx="36" cy="52" r="1.8" fill="#7C3AED" stroke="#6D28D9" stroke-width="0.6"/>
    <circle cx="36" cy="42" r="1" fill="#0080C8" opacity="0.5"/>
    <line x1="33" y1="22" x2="36" y2="22" stroke="rgba(0,128,200,0.35)" stroke-width="0.8"/>
    <line x1="39" y1="22" x2="36" y2="22" stroke="rgba(0,128,200,0.35)" stroke-width="0.8"/>
  </g>

  <!-- Divider -->
  <line x1="112" y1="24" x2="112" y2="76" stroke="rgba(0,100,200,0.25)" stroke-width="0.8"/>

  <!-- Wordmark -->
  <text x="126" y="62" class="brand-main-l">
    <tspan fill="#0070B8">BU</tspan><tspan fill="#0050A0">INT</tspan><tspan fill="#0a1a30">EL</tspan>
  </text>
  <text x="128" y="76" class="brand-sub-l" fill="rgba(0,70,140,0.5)">AUTOMATIONS</text>
</svg>
